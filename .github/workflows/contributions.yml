name: Contribution History Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  contribution-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution history graph
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: Dheeraj-suriya
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime

          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          variables = {
              "login": USERNAME
          }

          payload = json.dumps({
              "query": query,
              "variables": variables
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Contribution-Graph"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if "errors" in result:
              print("GitHub GraphQL error:")
              print(json.dumps(result["errors"], indent=2))
              raise SystemExit(1)

          user = result.get("data", {}).get("user")

          if not user:
              raise SystemExit(
                  f"GitHub user '{USERNAME}' was not found."
              )

          calendar = user["contributionsCollection"]["contributionCalendar"]

          total = calendar["totalContributions"]
          weeks = calendar["weeks"]

          days = []

          for week in weeks:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          # ---------------------------------------------------------
          # SVG configuration
          # ---------------------------------------------------------

          WIDTH = 1100
          HEIGHT = 500

          left = 85
          right = 35
          top = 105
          bottom = 75

          chart_width = WIDTH - left - right
          chart_height = HEIGHT - top - bottom

          # Last 365 days
          days = days[-365:]

          max_count = max(
              [day["count"] for day in days] or [1]
          )

          # Month labels
          months = []

          for i, day in enumerate(days):
              date = datetime.strptime(day["date"], "%Y-%m-%d")

              if date.day <= 7:
                  label = date.strftime("%b")
                  months.append((i, label))

          # Weekly aggregation
          weekly = []

          for i in range(0, len(days), 7):
              chunk = days[i:i + 7]

              weekly.append({
                  "start": chunk[0]["date"],
                  "total": sum(x["count"] for x in chunk)
              })

          max_week = max(
              [x["total"] for x in weekly] or [1]
          )

          # ---------------------------------------------------------
          # SVG helpers
          # ---------------------------------------------------------

          def esc(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          # ---------------------------------------------------------
          # Build SVG
          # ---------------------------------------------------------

          svg = []

          svg.append(
              f'''<svg xmlns="http://www.w3.org/2000/svg"
              width="{WIDTH}"
              height="{HEIGHT}"
              viewBox="0 0 {WIDTH} {HEIGHT}">'''
          )

          svg.append("""
          <defs>

            <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>

            <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#58a6ff"/>
              <stop offset="50%" stop-color="#a371f7"/>
              <stop offset="100%" stop-color="#3fb950"/>
            </linearGradient>

            <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

          </defs>
          """)

          # Background
          svg.append(
              f'<rect width="{WIDTH}" height="{HEIGHT}" '
              'rx="24" fill="url(#bg)"/>'
          )

          # Border
          svg.append(
              f'<rect x="1" y="1" width="{WIDTH-2}" height="{HEIGHT-2}" '
              'rx="24" fill="none" stroke="#30363d"/>'
          )

          # Title
          svg.append("""
          <text x="50" y="55"
                fill="#f0f6fc"
                font-family="Arial, Helvetica, sans-serif"
                font-size="25"
                font-weight="700">
            Contribution History
          </text>
          """)

          # Subtitle
          svg.append(
              f'''<text x="50" y="82"
              fill="#8b949e"
              font-family="Arial, Helvetica, sans-serif"
              font-size="14">
              Dheeraj Suriya  •  {total:,} contributions in the displayed period
            </text>'''
          )

          # Total badge
          badge_x = WIDTH - 245

          svg.append(
              f'''<rect x="{badge_x}" y="30"
              width="190" height="42" rx="21"
              fill="#21262d"
              stroke="#30363d"/>'''
          )

          svg.append(
              f'''<circle cx="{badge_x + 22}" cy="51"
              r="6" fill="#3fb950"/>'''
          )

          svg.append(
              f'''<text x="{badge_x + 38}" y="56"
              fill="#c9d1d9"
              font-family="Arial, Helvetica, sans-serif"
              font-size="13"
              font-weight="600">
              LIVE CONTRIBUTIONS
            </text>'''
          )

          # Chart axes
          chart_left = left
          chart_right = WIDTH - right
          chart_top = top
          chart_bottom = HEIGHT - bottom

          # Horizontal grid lines
          for n in range(5):

              y = (
                  chart_bottom
                  - (chart_height * n / 4)
              )

              value = int(max_week * n / 4)

              svg.append(
                  f'''<line x1="{chart_left}" y1="{y:.1f}"
                  x2="{chart_right}" y2="{y:.1f}"
                  stroke="#21262d"
                  stroke-width="1"/>'''
              )

              svg.append(
                  f'''<text x="{chart_left - 15}" y="{y + 4:.1f}"
                  text-anchor="end"
                  fill="#6e7681"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11">
                  {value}
                </text>'''
              )

          # X positions
          points = []

          for i, item in enumerate(weekly):

              x = (
                  chart_left
                  + (i / max(len(weekly) - 1, 1))
                  * chart_width
              )

              y = (
                  chart_bottom
                  - (
                      item["total"]
                      / max_week
                  )
                  * chart_height
              )

              points.append((x, y, item))

          # Area path
          if points:

              area = (
                  f"M {points[0][0]:.1f} {chart_bottom} "
                  + " ".join(
                      f"L {x:.1f} {y:.1f}"
                      for x, y, _ in points
                  )
                  + f" L {points[-1][0]:.1f} {chart_bottom} Z"
              )

              svg.append(
                  f'<path d="{area}" fill="url(#area)"/>'
              )

          # Line path
          if points:

              line_path = (
                  f"M {points[0][0]:.1f} {points[0][1]:.1f} "
                  + " ".join(
                      f"L {x:.1f} {y:.1f}"
                      for x, y, _ in points[1:]
                  )
              )

              svg.append(
                  f'''<path d="{line_path}"
                  fill="none"
                  stroke="url(#line)"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  filter="url(#glow)"/>'''
              )

          # Data points
          for x, y, item in points:

              date = item["start"]
              count = item["total"]

              svg.append(
                  f'''<circle cx="{x:.1f}" cy="{y:.1f}"
                  r="4"
                  fill="#58a6ff"
                  stroke="#0d1117"
                  stroke-width="2">
                  <title>{esc(date)} — {count} contributions</title>
                </circle>'''
              )

          # Month labels
          for i, label in months:

              week_index = i / 7

              x = (
                  chart_left
                  + (
                      week_index
                      / max(len(weekly) - 1, 1)
                  )
                  * chart_width
              )

              svg.append(
                  f'''<text x="{x:.1f}" y="{HEIGHT - 35}"
                  text-anchor="middle"
                  fill="#8b949e"
                  font-family="Arial, Helvetica, sans-serif"
                  font-size="11">
                  {esc(label)}
                </text>'''
              )

          # Footer
          svg.append(
              f'''<text x="{WIDTH - 50}" y="{HEIGHT - 35}"
              text-anchor="end"
              fill="#6e7681"
              font-family="Arial, Helvetica, sans-serif"
              font-size="11">
              Updated automatically
            </text>'''
          )

          svg.append("</svg>")

          os.makedirs("output", exist_ok=True)

          with open(
              "output/contribution-history.svg",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(svg))

          print(
              f"Generated contribution graph with "
              f"{total:,} total contributions."
          )
          PY

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/contribution-history.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update contribution history graph"
          git push
